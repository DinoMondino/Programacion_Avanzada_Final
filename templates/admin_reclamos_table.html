<div class="card shadow-sm mt-3">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Contenido</th>
                    <th><i class="bi bi-people-fill"></i></th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for r in reclamos_del_depto %}
                <tr>
                    <td><small class="text-muted">{{ r.id }}</small></td>
                    <td>{{ r.contenido[:60] }}...</td>
                    <td><span class="badge bg-secondary">{{ r.get_num_adherentes() }}</span></td>
                    <td>
                        <span class="badge 
                            {% if r.estado.name == 'PENDIENTE' %}bg-warning text-dark
                            {% elif r.estado.name == 'EN_PROCESO' %}bg-info
                            {% elif r.estado.name == 'RESUELTO' %}bg-success
                            {% else %}bg-danger{% endif %}">
                            {{ r.estado.value }}
                        </span>
                    </td>
                    <td>
                        <form action="{{ url_for('actualizar_estado') }}" method="post" class="d-flex gap-1">
                            <input type="hidden" name="id_reclamo" value="{{ r.id }}">
                            <select name="nuevo_estado" class="form-select form-select-sm">
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="EN_PROCESO">En Proceso</option>
                                <option value="RESUELTO">Resuelto</option>
                                <option value="INVALIDO">Inválido</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">✔</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% extends "base.html" %}

{% block title %}Inicio de Sesión{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center mb-4" style="color: #004d40;">Portal de Reclamos FI-UNER</h1>
            
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Iniciar Sesión</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('login') }}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #004d40; border-color: #004d40;">Ingresar</button>
                    </form>
                </div>
            </div>
            
            <div class="text-center">
                <p>¿Aún no tienes cuenta?</p>
                <a href="{{ url_for('register') }}" class="btn btn-outline-success">Registrarse como Usuario Final</a>
            </div>
            
        </div>
    </div>
{% endblock %}

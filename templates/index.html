{% extends "base.html" %}

{% block title %}Inicio de Sesión - FI UNER{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-5">
            
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo_uner.png') }}" width="150" alt="Logo UNER">
            <div class="text-center mb-4">
                <h1 class="h3 mt-2" style="color: #004d40;">Portal de Reclamos</h1>
                <p class="text-muted">Facultad de Ingeniería - UNER</p>
            </div>
            
            <div class="card shadow-lg border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('login') }}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nombre de Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" name="username" required placeholder="Usuario">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" name="password" required placeholder="••••••••">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2" style="background-color: #004d40; border: none;">
                            Ingresar
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="mb-1">¿No tienes una cuenta?</p>
                <a href="{{ url_for('register') }}" class="btn btn-outline-success btn-sm">Registrarse como Estudiante/Docente/PAyS</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

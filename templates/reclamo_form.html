{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Nuevo Reclamo</h2>
                <form action="{{ url_for('crear_reclamo_post') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Describe el problema:</label>
                        <textarea name="contenido" class="form-control" rows="5" required 
                                  placeholder="Sé lo más específico posible..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL de imagen (opcional):</label>
                        <input type="text" name="adjunto_url" class="form-control" placeholder="http://...">
                    </div>
                    <div class="alert alert-info py-2">
                        <small><i class="bi bi-robot"></i> Nuestro sistema clasificará automáticamente tu reclamo al enviarlo.</small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Enviar Reclamo</button>
                    <a href="{{ url_for('user_menu') }}" class="btn btn-link w-100 text-secondary mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
